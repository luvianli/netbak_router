#this is basic configruation file

config setup
    uniqueids=no    
 
conn L2TP-PSK-Android
    type=transport
    authby=psk
    keyexchange=ikev1
    keyingtries=3
    rekey=no
    left=%any
    right=%any
    auto=add
	
conn L2TP-PSK-IOS       
    keyexchange=ikev2
    ike=aes256-sha256-modp2048,3des-sha1-modp2048,aes256-sha1-modp2048!
    esp=aes256-sha256,3des-sha1,aes256-sha1!
    type=transport   
    authby=psk                                                         
    keyingtries=3                                                      
    rekey=no                                                           
    left=%any                                                          
    right=%any                                                         
    auto=add 


#Custom configuration file path
include /var/etc/ipsec.conf