
user root root;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    #default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;
	
    access_log  off;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
	
    fastcgi_intercept_errors on;
	
    upstream huayicgi-pool {                    
        server unix:/var/run/cgi_huayi.sock;    
    }
	
    upstream streamcgi-pool{                
        server unix:/var/run/cgi_stream.sock;   
    }

    upstream modemcgi-pool{                                                   
        server unix:/var/run/cgi_modem.sock;                                  
    }
	
    server {
        listen       80;
	listen [::]:80 default_server ipv6only=on;
        server_name  localhost;

        #charset koi8-r;
		
        client_max_body_size 20m;

        #access_log  logs/host.access.log  main;

        location / {
            root   /www;
            index  index.html index.htm;
        }
		
        location /cgi-bin/cgi_huayi.cgi {       
            root /etc/nginx/;     
            fastcgi_pass  huayicgi-pool;        
            fastcgi_index index.cgi;            
            include fastcgi_params;             
        }                                       
                                                
        location /cgi-bin/cgi_stream.cgi {      
            root /etc/nginx/;             
            fastcgi_pass  streamcgi-pool; 
            fastcgi_index index.cgi;      
            include fastcgi_params;              
        }

        location /cgi-bin/cgi_modem.cgi {                                     
            root /etc/nginx/;                                                 
            fastcgi_pass  modemcgi-pool;                                      
            fastcgi_index index.cgi;                                          
            include fastcgi_params;                                           
        }
		
        error_page  404 http://$http_host;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
			location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
