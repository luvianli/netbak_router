# ================================================================
# huayi Generic User-space to Kernel-space configuration system
# ================================================================
# Description:
# The system provides a generic cmd line program (called "huayi_cmd")
# to read/write information from/to the kernel space at runtime.
#
# Kernel software components require functionality, such as runtime
# configuration of parameters, can utilize this system to easily
# implement both the user-space cmd lines program and the actual
# implementation of kernel space configuration.
#
# The system contains 2 parts:
# (a) huayi_cmd user-space command line program
#
# The command line program is used to get/set parameters from/to the
# kernel space. The supported parameters and the format of the cmd
# line is customizable through config file "huayi_control.conf" (a2).
#
# (b) huayi_control kernel module
#
# The get/set parameters operation is executed through iocontrol interface (a1)
# to a virtual device created in the "huayi_control" kernel module.
#
# Each of the kernel software components can define it's own supported
# parameters and insert the cmd_handler_table (b1/b2) to this system
# dynamically. The system will serve as a transport and parser for
# the get/set command and callback the registered handler to do the
# actual work.
#
#    --------------  (a2)
# (a)|  huayi_cmd  | <--- huayi_control.conf (this files)
#    --------------
#        | (a1)
#        |                            user space
# ----------------------------------------------
#        |                          kernel space
#        |
#    -------------- (b1)  --------------------------------
# (b)|  huayi_control  | ----- |kmoduleY [cmd_handler_tableY] |
#    --------------       --------------------------------
#        | (b2)
#  -----------------------
# | kmoduleX             |
# | [cmd_handler_tableX] |
#  -----------------------
#
# =============
# huayi_control.conf
# =============
#
# This file is used to store the supported config commands
# which will be used in huayi_cmd. First part is section, it
# means which module the commands will be execute in kernel
# layer. Second part is the operation, like get or set. Third
# layer is cmd, including interface,type and format, providing
# the name of command, related interface, which type and format of
# parameter is supported

# @ interface : wifi, vap, sector, radio
# @ type : char, int, short, stream
# @ format : d, x, s

# =======================
# huayi_cmd command format
# =======================
# Details about the command mode.
# huayi_cmd <op> <section> <cmd> [<interface>] [<value>]
#
# @op: set or get
# @section: user defined section name
# @cmd: cmd listed below
# @interface: interface listed below, as sector/wifi.
# If empty, means system
# @value: If op is get, option value will not be used. If op
# is set, the value's type defined below(type)

